name: Browser extension releases
on:
  push:
    tags: ['extension-v*']
  pull_request:
    paths:
      - 'iroh-link-extension/**'
      - '.github/workflows/extension-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check release tag matches extension version
        if: startsWith(github.ref, 'refs/tags/extension-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('iroh-link-extension/manifest.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `extension-v${version}`) {
            throw new Error('Tag must match extension manifest version');
          }
          JS
      - run: npm --prefix iroh-link-extension test
      - run: npm --prefix iroh-link-extension run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-extensions
          path: |
            iroh-link-extension/dist/*.zip
            iroh-link-extension/dist/*.xpi
            iroh-link-extension/dist/*.sha256
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/extension-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-extensions
          path: dist
      - name: Publish extension packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG" --latest=false
          fi
