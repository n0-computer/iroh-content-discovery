name: Gateway installers
on:
  push:
    tags: ['gateway-v*']
  pull_request:
    paths:
      - 'iroh-link-gateway/**'
      - 'iroh-link-extension/**'
      - 'packaging/gateway/**'
      - '.github/workflows/gateway-release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: gateway-${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tag matches crate version
        if: startsWith(github.ref, 'refs/tags/gateway-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; v=tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version']; assert os.environ['RELEASE_TAG'] == 'gateway-v'+v, 'Tag must match workspace version'"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test iroh-link-extension/rules.test.js
      - run: python -m unittest discover -s packaging/gateway -p 'test_*.py'
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Install nfpm
        if: runner.os == 'Linux'
        env:
          NFPM_VERSION: '2.47.0'
          NFPM_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}
        run: |
          archive="nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl --fail --silent --show-error --location --remote-name "$base/$archive" --remote-name "$base/checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check
          sudo tar -xzf "$archive" -C /usr/local/bin nfpm
          rm "$archive" checksums.txt
      - run: cargo test -p iroh-link-gateway --locked --bins --test background
      - run: cargo build --release --locked -p iroh-link-gateway --bins --target ${{ matrix.target }}
      - run: python packaging/gateway/stage.py ${{ matrix.target }}
      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/gateway/windows/build.ps1
          ./packaging/gateway/windows/smoke.ps1
      - name: Build and test macOS installer
        if: runner.os == 'macOS'
        run: |
          python packaging/gateway/macos/build.py
          python packaging/gateway/macos/smoke.py
      - name: Build and test Linux archive and packages
        if: runner.os == 'Linux'
        run: |
          python packaging/gateway/linux/build.py ${{ matrix.target }}
          python packaging/gateway/linux/smoke.py
          python packaging/gateway/linux/packages.py ${{ matrix.target }}
          python packaging/gateway/linux/smoke_packages.py
      - name: Build and test AUR package
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: python packaging/gateway/aur/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*-setup.exe
            dist/*.pkg
            dist/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gateway-installer-logs-${{ matrix.target }}
          path: installer-test-logs/
  publish:
    if: startsWith(github.ref, 'refs/tags/gateway-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gateway-*
          merge-multiple: true
          path: dist
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
  aur:
    if: startsWith(github.ref, 'refs/tags/gateway-v')
    needs: publish
    runs-on: ubuntu-latest
    # The AUR_SSH_PRIVATE_KEY secret lives in this environment, which only
    # gateway-v* tags may deploy to.
    environment: aur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gateway-*-linux-musl
          merge-multiple: true
          path: dist
      - run: python packaging/gateway/aur/pkgbuild.py aur
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: iroh-link-gateway-bin
          pkgbuild: aur/PKGBUILD
          commit_username: n0 team
          commit_email: hello@n0.computer
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ github.ref_name }}
          # Build the package from the just-published release before pushing.
          test: true
