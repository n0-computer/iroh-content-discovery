name: Gateway installers
on:
  push:
    tags: ['gateway-v*']
  pull_request:
    paths:
      - 'iroh-link-gateway/**'
      - 'packaging/gateway/**'
      - '.github/workflows/gateway-release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release tag matches crate version
        if: startsWith(github.ref, 'refs/tags/gateway-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; v=tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version']; assert os.environ['RELEASE_TAG'] == 'gateway-v'+v, 'Tag must match workspace version'"
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Install nfpm
        if: runner.os == 'Linux'
        env:
          NFPM_VERSION: '2.47.0'
          NFPM_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}
        run: |
          archive="nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl --fail --silent --show-error --location --remote-name "$base/$archive" --remote-name "$base/checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check
          sudo tar -xzf "$archive" -C /usr/local/bin nfpm
          rm "$archive" checksums.txt
      - run: cargo test -p iroh-link-gateway --locked --bins --test background
      - run: cargo build --release --locked -p iroh-link-gateway --bins --target ${{ matrix.target }}
      - run: python packaging/gateway/stage.py ${{ matrix.target }}
      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/gateway/windows/build.ps1
          ./packaging/gateway/windows/smoke.ps1
      - name: Build and test macOS installer
        if: runner.os == 'macOS'
        run: |
          python packaging/gateway/macos/build.py
          python packaging/gateway/macos/smoke.py
      - name: Build and test Linux archive and packages
        if: runner.os == 'Linux'
        run: |
          python packaging/gateway/linux/build.py ${{ matrix.target }}
          python packaging/gateway/linux/smoke.py
          python packaging/gateway/linux/packages.py ${{ matrix.target }}
          python packaging/gateway/linux/smoke_packages.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*-setup.exe
            dist/*.pkg
            dist/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: gateway-installer-logs-${{ matrix.target }}
          path: installer-test-logs/
  publish:
    if: startsWith(github.ref, 'refs/tags/gateway-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/gateway/release_notes.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gateway-*
          merge-multiple: true
          path: dist
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # One checksum file keeps the release's file list short.
          cat dist/*.sha256 > dist/SHA256SUMS
          rm dist/*.sha256
          python3 packaging/gateway/release_notes.py "$GH_REPO" "$RELEASE_TAG" dist > notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            # Compare with the previous gateway release, not the newest tag,
            # which may be an extension release.
            previous=$(gh release list --limit 100 --json tagName \
              --jq '[.[].tagName | select(startswith("gateway-v") and . != $ENV.RELEASE_TAG)][0] // empty')
            start=()
            if [ -n "$previous" ]; then
              start=(--notes-start-tag "$previous")
            fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag --notes-file notes.md --generate-notes "${start[@]}" --title "$RELEASE_TAG"
          fi
