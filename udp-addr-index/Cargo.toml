[package]
name = "udp-addr-index"
description = "Small opaque records for verified UDP addresses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["udp", "p2p", "directory"]
categories = ["network-programming"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
data-encoding.workspace = true
iroh-metrics = { version = "1.0.1", features = ["service"] }
udp-addr-index-proto = { version = "0.1.0", path = "../udp-addr-index-proto" }
n0-mainline.workspace = true
postcard.workspace = true
rand.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
iroh-base.workspace = true
iroh-mainline-endpoint-discovery = { version = "0.1.0", path = "../iroh-mainline-endpoint-discovery" }
n0-future.workspace = true
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "udp-addr-index"
path = "src/bin/udp-addr-index.rs"

[lints]
workspace = true
