[package]
name = "udp-addr-index"
description = "Small opaque records for verified UDP addresses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["udp", "p2p", "directory"]
categories = ["network-programming"]

[features]
# The `udp-addr-index` server command. This crate is a library first, so the
# command is opt-in: `cargo build -p udp-addr-index --features cli`.
cli = ["dep:clap", "dep:data-encoding", "dep:tracing-subscriber"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
iroh-metrics = { version = "1.0.1", features = ["service"] }
udp-addr-index-proto = { version = "0.1.0", path = "../udp-addr-index-proto" }
n0-mainline.workspace = true
postcard.workspace = true
rand.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
iroh-base.workspace = true
iroh-mainline-endpoint-discovery = { version = "0.1.0", path = "../iroh-mainline-endpoint-discovery" }
n0-future.workspace = true
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "udp-addr-index"
path = "src/bin/udp-addr-index.rs"
required-features = ["cli"]

[lints]
workspace = true
