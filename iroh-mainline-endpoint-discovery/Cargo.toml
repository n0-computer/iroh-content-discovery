[package]
name = "iroh-mainline-endpoint-discovery"
description = "Publish and discover iroh endpoints through Mainline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["iroh", "p2p", "dht", "mainline", "discovery"]
categories = ["network-programming"]

[features]
# The `iroh-index-list` command. This crate is a library first, so the command
# is opt-in: `cargo build -p iroh-mainline-endpoint-discovery --features cli`.
cli = ["dep:clap", "dep:tracing-subscriber", "dep:zeroize"]

[[bin]]
name = "iroh-index-list"
path = "src/bin/iroh-index-list.rs"
required-features = ["cli"]

[dependencies]
async-stream = "0.3"
blake3.workspace = true
clap = { workspace = true, optional = true }
data-encoding.workspace = true
iroh-base.workspace = true
udp-addr-index-proto = { version = "0.1.0", path = "../udp-addr-index-proto" }
n0-error = "1.0.1"
n0-future.workspace = true
rand.workspace = true
simple-dns = "0.12"
n0-mainline.workspace = true
postcard.workspace = true
serde.workspace = true
sha1_smol.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
z32 = "1.3"
zeroize = { version = "1", optional = true }

[dev-dependencies]
# The examples are command line programs, and dev-dependencies keep them
# buildable without turning the `cli` feature on.
clap.workspace = true
iroh.workspace = true
iroh-blobs.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
