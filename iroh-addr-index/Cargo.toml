[package]
name = "iroh-addr-index"
description = "Verified SocketAddrV4 to iroh EndpointId index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["iroh", "p2p", "directory"]
categories = ["network-programming"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
iroh.workspace = true
iroh-addr-index-proto = { version = "0.1.0", path = "../iroh-addr-index-proto" }
postcard.workspace = true
serde.workspace = true
sha1_smol.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
iroh-mainline-endpoint-discovery = { version = "0.1.0", path = "../iroh-mainline-endpoint-discovery" }
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "iroh-addr-index"
path = "src/bin/iroh-addr-index.rs"

[lints]
workspace = true
