[package]
name = "iroh-local-gateway"
description = "Local HTTP streaming gateway for BLAKE3 content discovered through Mainline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
anyhow.workspace = true
async-stream = "0.3"
axum = "0.8"
bao-tree = "0.16"
blake3.workspace = true
bytes = "1"
clap.workspace = true
iroh.workspace = true
iroh-blobs.workspace = true
iroh-mainline-endpoint-discovery = { version = "0.1.0", path = "../iroh-mainline-endpoint-discovery" }
udp-address-records-proto = { version = "0.1.0", path = "../udp-address-records-proto" }
lru = "0.18"
mime_classifier = "0.0.1"
mime_guess = "2"
n0-mainline.workspace = true
n0-future.workspace = true
percent-encoding = "2"
pkarr = { version = "3.7.2", default-features = false, features = ["signed_packet"] }
rand.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true
z32 = "1.3"

[dev-dependencies]
tempfile = "3"
udp-address-records = { version = "0.1.0", path = "../udp-address-records" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
