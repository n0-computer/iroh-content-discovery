<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iroh link</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>iroh link</h1>
  <p>Open blake3.net and pkarr.net through your local gateway.</p>
  <form id="settings">
    <label for="port">Gateway port</label>
    <input id="port" name="port" type="number" min="1" max="65535" step="1" required>
    <label class="toggle"><input id="enabled" type="checkbox"> Enable local redirects</label>
    <button type="submit" disabled>Save</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
